name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl curl

      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-${{ runner.os }}

      - name: Install Quicklisp
        run: |
          if [ ! -f ~/quicklisp/setup.lisp ]; then
            curl -O https://beta.quicklisp.org/quicklisp.lisp
            sbcl --non-interactive \
                 --load quicklisp.lisp \
                 --eval '(quicklisp-quickstart:install)'
          fi

      - name: Fetch sblint
        run: git clone --depth 1 https://github.com/cxxxr/sblint ~/sblint

      - name: Lint
        run: |
          sbcl --non-interactive \
               --load ~/quicklisp/setup.lisp \
               --eval "(push #p\"$HOME/sblint/\" ql:*local-project-directories*)" \
               --eval "(push #p\"$GITHUB_WORKSPACE/\" asdf:*central-registry*)" \
               --eval '(ql:quickload :sblint)' \
               --eval '(uiop:quit (if (zerop (sblint:run-lint-asd #p"squiggle.asd")) 0 1))'

      - name: Run tests
        run: |
          sbcl --non-interactive \
               --load ~/quicklisp/setup.lisp \
               --eval "(push #p\"$GITHUB_WORKSPACE/\" asdf:*central-registry*)" \
               --eval '(ql:quickload :squiggle/tests)' \
               --eval '(uiop:quit (if (uiop:symbol-call :fiveam :run! :squiggle) 0 1))'
