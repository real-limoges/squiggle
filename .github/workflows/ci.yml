name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl curl

      - name: Install Qlot
        run: |
          curl -L https://qlot.tech/installer | bash
          echo "$HOME/.qlot/bin" >> $GITHUB_PATH

      - name: Cache Qlot deps
        uses: actions/cache@v4
        with:
          path: .qlot
          key: qlot-${{ runner.os }}-${{ hashFiles('qlfile.lock', 'qlfile') }}

      - name: Install dependencies
        run: qlot install

      - name: Load system and run smoke test
        run: |
          qlot exec sbcl --non-interactive \
               --eval "(asdf:load-system :squiggle)" \
               --eval "(squiggle::demo 1)"
